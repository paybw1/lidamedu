<!doctype html>
<meta charset="utf-8">
<style>
  @page { margin: 0 }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  body {
    width: 1200px; height: 675px;
    font-family: "Pretendard","Malgun Gothic","맑은 고딕",sans-serif;
    background: #faf8f4;
    color: #1c1917;
    display: flex; flex-direction: column;
  }
  .top {
    padding: 46px 64px 0;
    display: flex; flex-direction: column; gap: 14px;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 9px;
    align-self: flex-start;
    background: #fef3c7; color: #92400e;
    border: 1px solid #fcd34d;
    border-radius: 999px; padding: 7px 16px;
    font-size: 16px; font-weight: 800; letter-spacing: -0.01em;
  }
  h1 { font-size: 52px; font-weight: 900; letter-spacing: -0.035em; line-height: 1.14 }
  h1 em { font-style: normal; color: #b45309 }
  .sub { font-size: 20px; font-weight: 600; color: #57534e; letter-spacing: -0.02em }
  .steps {
    margin-top: 40px; padding: 0 64px;
    display: grid; grid-template-columns: 1fr 26px 1fr 26px 1fr; align-items: stretch; gap: 0;
  }
  .step {
    background: #fff; border: 1px solid #e7e2da; border-radius: 18px;
    padding: 26px 26px 24px;
    box-shadow: 0 1px 2px rgba(28,25,23,.05), 0 10px 26px -18px rgba(28,25,23,.35);
    display: flex; flex-direction: column; gap: 11px;
  }
  .n {
    width: 34px; height: 34px; border-radius: 10px;
    background: #1c1917; color: #fff;
    font-size: 17px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .st { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.3; word-break: keep-all }
  .sd { font-size: 16px; font-weight: 500; color: #78716c; line-height: 1.55; letter-spacing: -0.01em; word-break: keep-all }
  .arrow { display: flex; align-items: center; justify-content: center; color: #d6d3d1; font-size: 26px; font-weight: 700 }
  .btnchip {
    margin-top: auto; align-self: flex-start;
    display: inline-flex; align-items: center; gap: 7px;
    background: #fffbeb; border: 1.5px solid #fcd34d; color: #92400e;
    border-radius: 999px; padding: 8px 15px; font-size: 15px; font-weight: 800;
  }
  .btnchip .cnt { font-variant-numeric: tabular-nums; opacity: .75 }
  .foot {
    margin-top: auto; padding: 0 64px 44px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
  }
  .note { font-size: 16px; font-weight: 600; color: #78716c; letter-spacing: -0.015em; line-height: 1.6 }
  .note b { color: #292524; font-weight: 800 }
  .brand { font-size: 17px; font-weight: 800; color: #a8a29e; letter-spacing: -0.02em; white-space: nowrap }
  .rule { height: 4px; background: linear-gradient(90deg,#b45309 0%,#f59e0b 42%,#fde68a 100%) }
</style>
<div class="rule"></div>
<div class="top">
  <span class="eyebrow">■ 학습 플랫폼 신규 콘텐츠</span>
  <h1><em>도해특허법 제20판</em>을<br>조문 화면에서 바로 봅니다</h1>
  <p class="sub">공부하던 조문·단원에서 벗어나지 않고, 해당 부분의 도해를 그 자리에서 펼쳐 봅니다.</p>
</div>
<div class="steps">
  <div class="step">
    <div class="n">1</div>
    <p class="st">학습과목 → 특허법</p>
    <p class="sd">상단 학습과목에서 특허법으로 들어갑니다.</p>
  </div>
  <div class="arrow">›</div>
  <div class="step">
    <div class="n">2</div>
    <p class="st">체계도에서 단원 선택</p>
    <p class="sd">보려는 조문이 속한 단원을 엽니다.</p>
  </div>
  <div class="arrow">›</div>
  <div class="step">
    <div class="n">3</div>
    <p class="st">‘도해’ 버튼 클릭</p>
    <p class="sd">단원 화면 아래 버튼을 누릅니다.</p>
    <span class="btnchip">▤ 도해 <span class="cnt">3</span></span>
  </div>
</div>
<div class="foot">
  <p class="note">도해가 실린 단원에서만 버튼이 보입니다.<br><b>하이라이트·포스트잇</b>을 그대로 붙여 학습할 수 있습니다.</p>
  <span class="brand">리담변리사학원</span>
</div>
